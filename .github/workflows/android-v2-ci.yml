name: TrainPilot Native V2 CI

on:
  push:
    branches: [ "main", "master", "**" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Decode debug keystore if needed
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Run Unit and Robolectric Tests
        run: gradle :app:testDebugUnitTest :wear:testDebugUnitTest

      - name: Assemble Phone and Wear Debug APKs
        run: gradle :app:assembleDebug :wear:assembleDebug

      - name: Upload Phone Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: trainpilot-native-v2-phone-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Wear OS Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: trainpilot-native-v2-wear-debug-apk
          path: wear/build/outputs/apk/debug/wear-debug.apk

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            wear/build/reports/tests/testDebugUnitTest/
